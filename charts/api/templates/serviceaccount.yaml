{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api.serviceAccountName" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    # Empty under EKS Pod Identity: the IAM role is bound to the
    # (cluster, namespace, service account) triple by an association in AWS.
    # Under IRSA this is where eks.amazonaws.com/role-arn would go.
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
