apiVersion: v1
kind: Service
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # Named target port so a container port change cannot silently orphan
      # the Service. The ServiceMonitor also selects on this port name.
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
