{{- if .Values.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
    # kube-prometheus-stack's Prometheus selects ServiceMonitors by this label.
    # If it does not match the stack's release name, the monitor is created
    # successfully and then silently ignored -- targets simply never appear.
    release: {{ .Values.observability.serviceMonitor.releaseLabel }}
spec:
  selector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    # Selects the Service port by NAME. This is why the Service port is named.
    - port: http
      path: /metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.observability.serviceMonitor.scrapeTimeout }}
{{- end }}
