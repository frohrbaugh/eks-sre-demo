[project]
name = "sre-demo-api"
version = "0.1.0"
description = "Demo API for the EKS SRE portfolio project"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S"]
ignore = [
    "S104",  # binding 0.0.0.0 is correct inside a container
    "S311",  # random() is used for demo failure injection, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are the point of a test
