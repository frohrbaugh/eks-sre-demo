# Deliberately unannotated.
#
# With EKS Pod Identity the IAM role is bound to the (cluster, namespace,
# service account) triple by an association that lives in AWS, not in this
# manifest. That is why this file can stay in the cloud-agnostic base.
#
# With IRSA it could not: it would need
#   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT>:role/<ROLE>
# which is both AWS-specific and cluster-specific, forcing it into the overlay.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-api
automountServiceAccountToken: true
